<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCM Lite - Company Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <h2 id="company-title">HCM Lite</h2>
    </div>
    <ul class="nav-links">
      <li><a href="admin.html">Dashboard</a></li>
      <li><a href="employees.html">Employees</a></li>
      <li><a href="leaves.html">Leaves</a></li>
      <li><a href="settings.html" class="active">Settings</a></li>
    </ul>
    <div class="user-profile">
      <span id="admin-name-display" style="font-size: 0.9rem; font-weight: 600;">Admin</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Container -->
  <div class="container">
    <div class="page-header">
      <h1>Company Settings</h1>
    </div>

    <!-- Alert Message Box -->
    <div id="alert-msg" class="message hidden"></div>

    <!-- Settings Card Form -->
    <div class="card">
      <form id="settings-form" onsubmit="saveSettings(event)">
        <div class="form-group">
          <label for="company-name">Company Name</label>
          <input type="text" id="company-name-input" required placeholder="e.g. Acme Corporation">
        </div>

        <div class="form-group">
          <label for="start-time">Office Start Time</label>
          <input type="time" id="start-time" required>
          <small class="form-hint">Employees checking in after this time plus grace minutes will be marked late.</small>
        </div>

        <div class="form-group">
          <label for="grace-minutes">Grace Period (Minutes)</label>
          <input type="number" id="grace-minutes" min="0" max="60" required placeholder="e.g. 15">
          <small class="form-hint">Allowed buffer time after the office start time.</small>
        </div>

        <div class="form-group">
          <label for="leave-quota">Annual Leave Quota (Days)</label>
          <input type="number" id="leave-quota" min="0" required placeholder="e.g. 18">
          <small class="form-hint">Total paid leave days allocated per employee annually.</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
